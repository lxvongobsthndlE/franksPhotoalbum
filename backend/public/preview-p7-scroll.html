<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P7 Preview — Bottom-Bar-Overlap-Fix auf #content</title>
  <link rel="stylesheet" href="./style/main.css" />
  <link rel="stylesheet" href="./style/tournament.css" />
  <style>
    body { margin: 0; background: #FAF7F1; font-family: inherit;
           display: flex; min-height: 100vh; }
    /* #content — der ECHTE Scroller. Außerhalb .t-mod. */
    #content {
      flex: 1; overflow-y: auto; padding: 30px 28px; min-width: 0;
    }
    .preview-hint { color: #8A8077; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <!-- Layout: #content > .t-detail-host > .t-mod (Container + Bottom-Bar) -->
  <main id="content">
    <p class="preview-hint">↓ Inhalt darunter simuliert ein langes Spielplan-Tab. Wenn der
       P7-Fix greift, kann man bis ganz nach unten scrollen OHNE dass
       die letzte Match-Karte hinter der fixierten Bottom-Bar verschwindet.</p>
    <!-- 60 Match-Cards, damit der Scroll definitiv lang genug ist -->
    <div class="t-mod" style="height: calc(100vh - 60px); overflow: hidden;">
      <header class="t-mod-header">
        <div class="t-logo">🏆</div>
        <div class="t-mod-header-info">
          <div class="t-mod-header-text"><div class="t-title">Sommer-Cup 2026 (P7 Test)</div></div>
          <div class="t-mod-header-badges"><span class="t-badge t-badge--status is-active">Aktiv</span></div>
        </div>
      </header>
      <div class="t-mod-tabs" role="tablist">
        <button type="button" class="t-mod-tab is-active" data-view="spielplan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>
          <span>Spiele</span>
        </button>
        <button type="button" class="t-mod-tab" data-view="gruppen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
          <span>Gruppen</span>
        </button>
        <button type="button" class="t-mod-tab" data-view="baum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>
          <span>Baum</span>
        </button>
        <button type="button" class="t-mod-tab" data-action="open-more-menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          <span>Mehr</span>
        </button>
      </div>
      <div class="t-mod-more-sheet" data-open="false" style="display:none"><div class="t-mod-more-panel"></div></div>
      <div class="t-shell">
        <nav class="t-mod-nav" style="display:none">
          <button data-view="spielplan" class="is-active">Spielplan</button>
        </nav>
        <main class="t-mod-main">
          <section class="t-view is-active" data-view="spielplan">
            <div class="t-card"><div class="t-card-body" id="matches"></div></div>
          </section>
        </main>
        <aside class="t-mod-aside" style="display:none"></aside>
      </div>
    </div>
  </main>
<script>
  (function () {
    const c = document.getElementById('matches');
    for (let i = 1; i <= 60; i++) {
      const teamA = `Team ${String.fromCharCode(65 + ((i - 1) % 8))}`;
      const teamB = `Team ${String.fromCharCode(65 + (i % 8))}`;
      const hr = 9 + (i % 6);
      const min = (i * 17) % 60;
      const div = document.createElement('div');
      div.className = 't-match';
      div.innerHTML = `
        <div class="t-match-bar"></div>
        <div class="t-match-meta"><div class="t-match-meta-line">${String(hr).padStart(2,'0')}:${String(min).padStart(2,'0')} · Platte ${(i % 4) + 1}</div></div>
        <div class="t-match-rows">
          <div class="t-match-team"><span class="name">${teamA}</span></div>
          <div class="t-match-score" data-area="home-score">${i % 3}</div>
          <div class="t-match-team right"><span class="name">${teamB}</span></div>
          <div class="t-match-score" data-area="away-score">${(i + 1) % 3}</div>
        </div>`;
      c.appendChild(div);
    }
  })();
  // Auto-Scroll: ?scroll=bottom scrollt #content zum Ende.
  (function () {
    if (new URLSearchParams(location.search).get('scroll') === 'bottom') {
      setTimeout(() => { document.getElementById('content').scrollTop = 999999; }, 50);
    }
  })();
</script>
</body>
</html>
