<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pruefstand Markenuebernahme</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/tokens.css" />
    <link rel="stylesheet" href="./style/tournament.css" />
    <link rel="stylesheet" href="./style/brand.css" />
    <style>
      /* NUR fuer den Pruefstand — kein Bestandteil der App.
   main.css baut die App als Flex-Saeule: body ist die Saeule, #body-wrap
   ein Flex-Kind mit `flex: 1`, #content darin ebenfalls. Ohne diese
   Kette hat #body-wrap keine Hoehe, #content endet mit seinem Inhalt,
   und unter dem Blatt stand im Screenshot der cremefarbene App-Grund.
   Das haette wie ein Fehler des Moduls ausgesehen und war einer des
   Pruefstands. */
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="body-wrap">
      <nav id="sidebar"></nav>
      <div id="content">
        <div id="grid" class="grid"></div>
      </div>
    </div>
    <script type="module" src="./script/pruefstand-marke.js"></script>
  </body>
</html>
